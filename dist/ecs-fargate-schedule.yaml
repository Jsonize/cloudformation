AWSTemplateFormatVersion: 2010-09-09

# https://s3.amazonaws.com/cloudformation.jsonize.com/ecs-fargate-schedule.yaml

Description: Create ECS task on Fargate


Parameters:

  TaskName:
    Type: String
    Description: The name of the task

  ScheduleName:
    Type: String
    Description: The name of the schedule

  ScheduleExpression:
    Type: String
    Description: Schedule expression, e.g. 'rate(6 hours)'

  ScheduleTimezone:
    Type: String
    Description: Optional IANA timezone for the schedule, e.g. Europe/Berlin
    Default: ""

  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Cluster security group

  ClusterSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets of cluster

  ExecutionRoleArn:
    Type: String
    Description: Execution role for task

  ClusterName:
    Type: String
    Description: Name of target cluster

  ContainerOverrides:
    Type: String
    Description: Optional container overrides (JSON)
    Default: ""


Conditions:
  HasContainerOverrides: !Not [ !Equals ["", !Ref ContainerOverrides]]
  HasScheduleTimezone: !Not [ !Equals ["", !Ref ScheduleTimezone]]
  NoScheduleTimezone: !Equals ["", !Ref ScheduleTimezone]


Resources:

  ECSFargateScheduleScheduler:
    Type: AWS::Scheduler::Schedule
    Condition: HasScheduleTimezone
    Properties:
      Name: !Ref ScheduleName
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        RoleArn: !Ref ExecutionRoleArn
        Arn: !Join [ "", ["arn:aws:ecs:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":cluster/", !Ref ClusterName]]
        Input: !If [HasContainerOverrides, !Join [ "", [ "{\"containerOverrides\":[", !Ref ContainerOverrides, "]}" ] ], !Ref "AWS::NoValue"]
        EcsParameters:
          TaskDefinitionArn: !Join [ "", ["arn:aws:ecs:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":task-definition/", !Ref TaskName]]
          TaskCount: 1
          PropagateTags: TASK_DEFINITION
          LaunchType: 'FARGATE'
          PlatformVersion: 'LATEST'
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              SecurityGroups:
                - !Ref ClusterSecurityGroup
              Subnets: !Ref ClusterSubnets

  ECSFargateScheduleRule:
    Type: AWS::Events::Rule
    Condition: NoScheduleTimezone
    Properties:
      Name: !Ref ScheduleName
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: !Ref ScheduleName
          RoleArn: !Ref ExecutionRoleArn
          Arn: !Join [ "", ["arn:aws:ecs:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":cluster/", !Ref ClusterName]]
          Input: !If [HasContainerOverrides, !Join [ "", [ "{\"containerOverrides\":[", !Ref ContainerOverrides, "]}" ] ], !Ref "AWS::NoValue"]
          EcsParameters:
            TaskDefinitionArn: !Join [ "", ["arn:aws:ecs:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":task-definition/", !Ref TaskName]]
            TaskCount: 1
            PropagateTags: TASK_DEFINITION
            LaunchType: 'FARGATE'
            PlatformVersion: 'LATEST'
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: ENABLED
                SecurityGroups:
                  - !Ref ClusterSecurityGroup
                Subnets: !Ref ClusterSubnets
