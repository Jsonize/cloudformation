AWSTemplateFormatVersion: 2010-09-09

# https://s3.amazonaws.com/cloudformation.jsonize.com/apigateway-lambda-proxy-basic-auth.yaml

Description: Resources for setting up an api gateway with a lambda proxy backend.

Parameters:

  CertificateArn:
    Type: String
    Description: The arn of the SSL certificate

  ZoneDomain:
    Type: String
    Description: The zone domain for the resource

  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Optional Route 53 hosted zone id. Set this when multiple hosted zones
      share the same ZoneDomain name (otherwise the DNS record lookup by name
      is ambiguous and the stack fails with "Multiple hosted zones with name
      ... found"). When empty, the zone is resolved by ZoneDomain name.

  SubDomain:
    Type: String
    Description: The sub domain for the resource

  ResourceName:
    Type: String
    Description: The resource name

  LambdaFunctionArn:
    Type: String
    Description: The lambda function arn

  BasicAuthUser:
    Type: String
    Description: Basic auth user name

  BasicAuthPassword:
    Type: String
    Description: Basic auth password


Conditions:
  UseHostedZoneId: !Not [ !Equals [ !Ref HostedZoneId, "" ] ]


Resources:

  ApiGatewayApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      BinaryMediaTypes:
        - multipart/form-data
        - application/octet-stream
        - application/pdf
        - application/force-download
      Body:
        swagger: 2.0
        info:
          title: !Ref ResourceName
        basePath: /production
        schemes:
          - https
        paths:
          /{proxy+}:
            x-amazon-apigateway-any-method:
              produces:
                - application/json
              parameters:
                - name: proxy
                  in: path
                  required: true
                  type: string
              responses: {}
              security:
                - BasicAuthAuthorizer: []
              x-amazon-apigateway-integration:
                uri: !Join ["", ["arn:aws:apigateway:", !Ref "AWS::Region", ":lambda:path/2015-03-31/functions/", !Ref LambdaFunctionArn, "/invocations" ] ]
                httpMethod: POST
                type: aws_proxy
            options:
              consumes:
                - application/json
              produces:
                - application/json
              responses:
                "200":
                  description: 200 response
                  schema:
                    $ref: "#/definitions/Empty"
                  headers:
                    Access-Control-Allow-Origin:
                      type: string
                    Access-Control-Allow-Methods:
                      type: string
                    Access-Control-Allow-Headers:
                      type: string
              x-amazon-apigateway-integration:
                responses:
                  default:
                    statusCode: 200
                    responseParameters:
                      method.response.header.Access-Control-Allow-Methods: "'DELETE,GET,HEAD,OPTIONS,PATCH,POST,PUT'"
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                passthroughBehavior: when_no_match
                requestTemplates:
                  application/json: "{\"statusCode\": 200}"
                type: mock
        definitions:
          Empty:
            type: object
            title: Empty Schema
        securityDefinitions:
          BasicAuthAuthorizer:
            type: apiKey
            name: Authorization
            in: header
            x-amazon-apigateway-authtype: custom
            x-amazon-apigateway-authorizer:
              type: request
              identitySource: method.request.header.Authorization
              # No result caching: cache is keyed on the identity source, which
              # would let one accepted credential authorise others until TTL.
              authorizerResultTtlInSeconds: 0
              authorizerUri: !Join ["", ["arn:aws:apigateway:", !Ref "AWS::Region", ":lambda:path/2015-03-31/functions/", !GetAtt LambdaAuthorizer.Arn, "/invocations" ] ]
              authorizerCredentials: !GetAtt LambdaAuthorizerApiGatewayRole.Arn

  LambdaApiGatewayExecutionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Join ["", [ "arn:aws:execute-api:", !Ref "AWS::Region", ":", !Ref "AWS::AccountId", ":", !Ref ApiGatewayApi, "/*/*" ] ]

  ApiGatewayApiDomainName:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Join [ ".", [ !Ref SubDomain, !Ref ZoneDomain ] ]
      CertificateArn: !Ref CertificateArn
      EndpointConfiguration:
        Types:
          - EDGE

  ApiGatewayApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayApi
    Properties:
      RestApiId: !Ref ApiGatewayApi

  ApiGatewayApiStage:
    Type: AWS::ApiGateway::Stage
    DependsOn:
      - ApiGatewayApi
      - ApiGatewayApiDeployment
    Properties:
      RestApiId: !Ref ApiGatewayApi
      DeploymentId: !Ref ApiGatewayApiDeployment
      StageName: production

  ApiGatewayBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn:
      - ApiGatewayApi
      - ApiGatewayApiStage
      - ApiGatewayApiDomainName
    Properties:
      RestApiId: !Ref ApiGatewayApi
      DomainName: !Join [ ".", [ !Ref SubDomain, !Ref ZoneDomain ] ]
      Stage: !Ref ApiGatewayApiStage

  ApiGatewayRoute53:
    Type: AWS::Route53::RecordSet
    DependsOn:
      - ApiGatewayApiDomainName
    Properties:
      HostedZoneName: !If [ UseHostedZoneId, !Ref "AWS::NoValue", !Join [ "", [ !Ref ZoneDomain, "." ] ] ]
      HostedZoneId: !If [ UseHostedZoneId, !Ref HostedZoneId, !Ref "AWS::NoValue" ]
      Name: !Join [ ".", [ !Ref SubDomain, !Ref ZoneDomain ] ]
      Type: A
      AliasTarget:
        # EDGE-optimised API Gateway domains are fronted by CloudFront, so the
        # alias target zone is the fixed CloudFront hosted zone id.
        DNSName: !GetAtt ApiGatewayApiDomainName.DistributionDomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:*
                Resource: arn:aws:logs:*:*:*

  LambdaAuthorizer:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaAuthorizerRole
    Properties:
      Code:
        ZipFile: |
          const crypto = require('crypto');
          
          // Constant-time string comparison to avoid leaking length/prefix via timing.
          function safeEqual(a, b) {
              const ab = Buffer.from(String(a));
              const bb = Buffer.from(String(b));
              if (ab.length !== bb.length) {
                  // Still run a comparison to keep timing roughly constant.
                  crypto.timingSafeEqual(ab, ab);
                  return false;
              }
              return crypto.timingSafeEqual(ab, bb);
          }
          
          exports.handler = function (event, context, callback) {
              const headers = event.headers || {};
              // API Gateway does not normalise header casing across clients (HTTP/2
              // lower-cases header names), so accept either form.
              const authorizationHeader = headers.Authorization || headers.authorization;
          
              if (!authorizationHeader) {
                  return callback('Unauthorized');
              }
          
              const parts = authorizationHeader.split(' ');
              if (parts.length !== 2 || parts[0] !== 'Basic') {
                  return callback('Unauthorized');
              }
          
              let plainCreds;
              try {
                  plainCreds = Buffer.from(parts[1], 'base64').toString('utf8').split(':');
              } catch (e) {
                  return callback('Unauthorized');
              }
          
              const username = plainCreds[0];
              const password = plainCreds.slice(1).join(':'); // passwords may contain ':'
          
              const userOk = safeEqual(username, process.env.BASIC_AUTH_USER);
              const passOk = safeEqual(password, process.env.BASIC_AUTH_PASSWORD);
              if (!(userOk && passOk)) {
                  return callback('Unauthorized');
              }
          
              const tmp = event.methodArn.split(':');
              const apiGatewayArnTmp = tmp[5].split('/');
              const awsAccountId = tmp[4];
              const awsRegion = tmp[3];
              const restApiId = apiGatewayArnTmp[0];
              const stage = apiGatewayArnTmp[1];
              const apiArn = 'arn:aws:execute-api:' + awsRegion + ':' + awsAccountId + ':' + restApiId + '/' + stage + '/*/*';
          
              callback(null, {
                  principalId: 'user',
                  policyDocument: {
                      Version: '2012-10-17',
                      Statement: [{
                          Action: 'execute-api:Invoke',
                          Effect: 'Allow',
                          Resource: apiArn
                      }]
                  }
              });
          };
          
      Environment:
        Variables:
          BASIC_AUTH_USER: !Ref BasicAuthUser
          BASIC_AUTH_PASSWORD: !Ref BasicAuthPassword
      Handler: index.handler
      Role: !GetAtt LambdaAuthorizerRole.Arn
      Runtime: nodejs22.x
      Timeout: 60

  LambdaAuthorizerApiGatewayRole:
    Type: AWS::IAM::Role
    DependsOn:
      - LambdaAuthorizer
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt LambdaAuthorizer.Arn

  ApiGatewayBasicAuthResponse:
    Type: AWS::ApiGateway::GatewayResponse
    DependsOn:
      - ApiGatewayApi
    Properties:
      ResponseParameters:
        gatewayresponse.header.WWW-Authenticate: "'Basic'"
      ResponseType: UNAUTHORIZED
      RestApiId: !Ref ApiGatewayApi
      StatusCode: '401'
